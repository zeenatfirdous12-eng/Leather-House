<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Leather House | Product</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5efe7;
  color:#24170f;
}

header{
  background:#2b160d;
  color:#fff;
  padding:20px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:2px;
}

.back{
  color:#fff;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.5);
  padding:10px 16px;
  border-radius:4px;
  font-size:13px;
  font-weight:bold;
}

.product-page{
  max-width:1200px;
  margin:50px auto;
  padding:0 20px;
}

.product-box{
  background:#fff;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:45px;
  padding:35px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.product-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}

.product-info{
  padding:10px 0;
}

.tag{
  display:inline-block;
  background:#8b5e3c;
  color:#fff;
  padding:7px 12px;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:18px;
}

h1{
  font-size:38px;
  line-height:1.15;
  margin:0 0 15px;
}

.price{
  font-size:28px;
  font-weight:800;
  color:#6d4027;
  margin-bottom:25px;
}

.description{
  color:#66564b;
  line-height:1.7;
  margin-bottom:25px;
}

.option-label{
  font-weight:bold;
  font-size:13px;
  display:block;
  margin-bottom:8px;
}

select{
  width:100%;
  padding:14px;
  border:1px solid #d8c8ba;
  background:#fff;
  font-size:15px;
  margin-bottom:20px;
}

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  padding:15px 22px;
  cursor:pointer;
  font-weight:bold;
  letter-spacing:.5px;
  font-size:13px;
}

.btn-cart{
  background:#2b160d;
  color:#fff;
}

.btn-order{
  background:#8b5e3c;
  color:#fff;
}

.info-box{
  margin-top:30px;
  border-top:1px solid #dfd3c8;
  padding-top:25px;
}

.info-box h3{
  margin:0 0 15px;
  font-size:18px;
}

.info-box p{
  margin:8px 0;
  color:#66564b;
  line-height:1.5;
}

.size-chart{
  margin-top:40px;
  background:#fff;
  padding:30px;
  box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.size-chart h2{
  margin-top:0;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:13px;
  border:1px solid #ddd1c7;
  text-align:center;
}

th{
  background:#2b160d;
  color:#fff;
}

footer{
  margin-top:60px;
  background:#2b160d;
  color:#fff;
  text-align:center;
  padding:30px 20px;
}

footer p{
  margin:7px 0;
  color:#e4d9d0;
}

@media(max-width:800px){
  .product-box{
    grid-template-columns:1fr;
    padding:20px;
    gap:25px;
  }

  h1{
    font-size:30px;
  }

  .product-page{
    margin:25px auto;
  }

  .size-chart{
    padding:15px;
    overflow-x:auto;
  }

  table{
    min-width:650px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    THE LEATHER HOUSE
  </div>

  <a class="back" href="index.html#shop">
    BACK TO JACKETS
  </a>

</header>


<main class="product-page">

  <div id="productContainer"></div>

</main>


<footer>

  <p><strong>THE LEATHER HOUSE</strong></p>
  <p>Premium Leather Jackets in Pakistan</p>
  <p>WhatsApp: +92 311 2674115</p>
  <p>Email: info@theleatherhouse.pk</p>

</footer>


<script>

/* ==========================================
   PRODUCTS
========================================== */

const products = [

  {
    id:1,
    name:'Classic Brown Leather Jacket',
    price:14999,
    category:'men',
    tag:'Best Seller',
    image:'https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=900&q=85',
    sizes:'S,M,L,XL,XXL'
  },

  {
    id:2,
    name:'Black Biker Leather Jacket',
    price:16999,
    category:'men',
    tag:'Classic',
    image:'https://images.unsplash.com/photo-1521223890158-f9f7c3d5d504?auto=format&fit=crop&w=900&q=85',
    sizes:'S,M,L,XL,XXL'
  },

  {
    id:3,
    name:'Vintage Brown Leather Jacket',
    price:15999,
    category:'women',
    tag:'New',
    image:'https://images.unsplash.com/photo-1548883354-94bcfe321cbb?auto=format&fit=crop&w=900&q=85',
    sizes:'S,M,L,XL'
  },

  {
    id:4,
    name:'Premium Black Leather Jacket',
    price:17999,
    category:'women',
    tag:'Premium',
    image:'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=85',
    sizes:'S,M,L,XL'
  }

];


/* ==========================================
   GET PRODUCT ID FROM URL
========================================== */

const params = new URLSearchParams(window.location.search);

const productId = Number(params.get('id'));


/* ==========================================
   FIND PRODUCT
========================================== */

const product = products.find(function(item){

  return item.id === productId;

});


/* ==========================================
   MONEY FORMAT
========================================== */

function money(amount){

  return 'Rs. ' + Number(amount).toLocaleString('en-PK');

}


/* ==========================================
   SHOW PRODUCT
========================================== */

function showProduct(){

  const container = document.getElementById('productContainer');


  if(!product){

    container.innerHTML = `

      <div style="
        background:#fff;
        padding:60px 25px;
        text-align:center;
        box-shadow:0 10px 35px rgba(0,0,0,.08);
      ">

        <h1 style="font-size:32px;">
          Product Not Found
        </h1>

        <p style="
          color:#66564b;
          margin:15px 0 30px;
        ">
          This jacket is no longer available.
        </p>

        <a
          href="index.html#shop"
          style="
            display:inline-block;
            background:#2b160d;
            color:#fff;
            padding:14px 22px;
            text-decoration:none;
            font-weight:bold;
            font-size:13px;
          "
        >
          BACK TO JACKETS
        </a>

      </div>

    `;

    return;

  }


  const sizes = String(product.sizes || 'S,M,L,XL,XXL')
    .split(',')
    .map(function(size){

      return `
        <option value="${size.trim()}">
          ${size.trim()}
        </option>
      `;

    })
    .join('');


  container.innerHTML = `

    <div class="product-box">

      <div>

        <img
          class="product-image"
          src="${product.image}"
          alt="${product.name}"
        >

      </div>


      <div class="product-info">

        <span class="tag">
          ${product.tag || 'Leather Jacket'}
        </span>


        <h1>
          ${product.name}
        </h1>


        <div class="price">
          ${money(product.price)}
        </div>


        <div class="description">

          Premium quality leather jacket designed
          for comfort, durability and timeless style.
          Perfect for everyday wear and winter season.

        </div>


        <label class="option-label">
          SELECT SIZE
        </label>


        <select id="productSize">

          ${sizes}

        </select>


        <div class="buttons">

          <button
            class="btn btn-cart"
            onclick="addToCart()"
          >
            ADD TO CART
          </button>


          <button
            class="btn btn-order"
            onclick="orderNow()"
          >
            ORDER NOW
          </button>

        </div>


        <div class="info-box">

          <h3>
            DELIVERY INFORMATION
          </h3>

          <p>
            Karachi: Rs. 300 delivery
          </p>

          <p>
            Rest of Pakistan: Rs. 600 delivery
          </p>

          <p>
            Delivery available across Pakistan.
          </p>

        </div>


        <div class="info-box">

          <h3>
            CUSTOMER SUPPORT
          </h3>

          <p>
            WhatsApp: +92 311 2674115
          </p>

          <p>
            Email: info@theleatherhouse.pk
          </p>

        </div>

      </div>

    </div>


    <div class="size-chart">

      <h2>
        SIZE CHART
      </h2>

      <table>

        <thead>

          <tr>
            <th>SIZE</th>
            <th>CHEST</th>
            <th>SHOULDER</th>
            <th>SLEEVE</th>
            <th>JACKET LENGTH</th>
          </tr>

        </thead>

        <tbody>

          <tr>
            <td>S</td>
            <td>38"</td>
            <td>17"</td>
            <td>24.5"</td>
            <td>25"</td>
          </tr>

          <tr>
            <td>M</td>
            <td>40"</td>
            <td>17.5"</td>
            <td>25"</td>
            <td>26"</td>
          </tr>

          <tr>
            <td>L</td>
            <td>42"</td>
            <td>18"</td>
            <td>25.5"</td>
            <td>27"</td>
          </tr>

          <tr>
            <td>XL</td>
            <td>44"</td>
            <td>18.5"</td>
            <td>26"</td>
            <td>28"</td>
          </tr>

          <tr>
            <td>XXL</td>
            <td>46"</td>
            <td>19"</td>
            <td>26.5"</td>
            <td>29"</td>
          </tr>

        </tbody>

      </table>

    </div>

  `;

}


/* ==========================================
   ADD TO CART
========================================== */

function addToCart(){

  if(!product) return;


  const size =
    document.getElementById('productSize').value;


  let cart = [];

  try{

    cart =
      JSON.parse(
        localStorage.getItem('lh_cart') || '[]'
      );

  }catch(error){

    cart = [];

  }


  cart.push({

    ...product,

    size:size

  });


  localStorage.setItem(
    'lh_cart',
    JSON.stringify(cart)
  );


  alert(
    product.name +
    ' added to cart.'
  );

}


/* ==========================================
   ORDER NOW
========================================== */

function orderNow(){

  if(!product) return;


  const size =
    document.getElementById('productSize').value;


  const orderItem = {

    ...product,

    size:size

  };


  localStorage.setItem(
    'lh_direct_order',
    JSON.stringify(orderItem)
  );


  /*
     Go back to homepage.
     Homepage can then open checkout.
  */

  window.location.href =
    'index.html?directOrder=1';

}


/* ==========================================
   START
========================================== */

showProduct();

</script>

</body>
</html>
