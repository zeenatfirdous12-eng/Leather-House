<script>

/* =====================================================
GOOGLE APPS SCRIPT
===================================================== */

const GOOGLE_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbwtsaYU_YJ9aB0LeVLBBeP18zTO01pTjdprzPaat1Gd2eV0DJ0yNT6pBjEDZKMIavINA/exec';

const ORDER_SECRET =
'TLH_2026_Order_8472';


/* =====================================================
URL PRODUCT ID
===================================================== */

const params =
new URLSearchParams(window.location.search);

const urlId =
params.get('id');


/* =====================================================
PRODUCT
===================================================== */

let product = null;


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value ?? '')

.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}


/* =====================================================
LOAD PRODUCT FROM GOOGLE APPS SCRIPT
===================================================== */

async function loadProduct(){

if(!urlId){

showProductNotFound();
return;

}


try{

const url =
GOOGLE_SCRIPT_URL +
'?action=products' +
'&secret=' +
encodeURIComponent(ORDER_SECRET);


const response =
await fetch(url,{
method:'GET',
cache:'no-store'
});


if(!response.ok){

throw new Error(
'Products request failed: ' +
response.status
);

}


const result =
await response.json();


console.log(
'Products API response:',
result
);


/* ---------------------------------------------
GET PRODUCTS ARRAY
--------------------------------------------- */

let products = [];


if(Array.isArray(result)){

products = result;

}

else if(
result &&
Array.isArray(result.products)
){

products = result.products;

}

else if(
result &&
result.data &&
Array.isArray(result.data)
){

products = result.data;

}

else if(
result &&
result.data &&
Array.isArray(result.data.products)
){

products = result.data.products;

}


/* ---------------------------------------------
FIND PRODUCT
--------------------------------------------- */

product =
products.find(
p =>
String(p.id) === String(urlId)
);


/* ---------------------------------------------
IF NOT FOUND
--------------------------------------------- */

if(!product){

console.warn(
'Product ID not found:',
urlId,
products
);

showProductNotFound();

return;

}


/* ---------------------------------------------
NORMALIZE PRODUCT
--------------------------------------------- */

product = {

id:
product.id,

name:
product.name ||
product.productName ||
'Leather Jacket',

price:
Number(
product.price ||
product.productPrice ||
0
),

category:
product.category ||
'men',

tag:
product.tag ||
'Leather Jacket',

image:
product.image ||
product.imageUrl ||
product.imageURL ||
'',

sizes:
product.sizes ||
'S,M,L,XL,XXL'

};


/* ---------------------------------------------
DISPLAY
--------------------------------------------- */

displayProduct();


}catch(error){

console.error(
'Product loading error:',
error
);

showProductNotFound();

}

}


/* =====================================================
PRODUCT NOT FOUND
===================================================== */

function showProductNotFound(){

document.body.innerHTML = `

<div style="
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:30px;
font-family:Arial,Helvetica,sans-serif;
background:#f6eee4;
color:#20140e;
">

<div>

<h1 style="
font-family:Georgia,'Times New Roman',serif;
font-size:42px;
margin-bottom:12px;
">

Product Not Found

</h1>

<p style="
color:#79685d;
font-size:15px;
margin-bottom:25px;
">

This jacket is no longer available.

</p>

<a
href="index.html#shop"
style="
display:inline-block;
padding:14px 22px;
background:#9b542d;
color:#fff;
text-decoration:none;
border-radius:3px;
font-weight:bold;
">

BACK TO JACKETS

</a>

</div>

</div>

`;

}


/* =====================================================
DISPLAY PRODUCT
===================================================== */

function displayProduct(){

document.title =
product.name +
' | The Leather House';


/* IMAGE */

const image =
document.getElementById(
'productImage'
);

image.src =
product.image;

image.alt =
product.name;


/* NAME */

document
.getElementById('productName')
.textContent =
product.name;


/* BREADCRUMB */

document
.getElementById('breadcrumbName')
.textContent =
product.name;


/* PRICE */

document
.getElementById('productPrice')
.textContent =
'Rs. ' +
Number(product.price)
.toLocaleString('en-PK');


/* TAG */

document
.getElementById('productTag')
.textContent =
product.tag ||
'Leather Jacket';


/* DESCRIPTION */

const description =
'Premium ' +
product.name +
' designed for timeless style, comfort and everyday wear.';


document
.getElementById('productDescription')
.textContent =
description;


document
.getElementById('detailDescription')
.textContent =
description;


/* =====================================================
SIZES
===================================================== */

const sizeSelect =
document.getElementById(
'productSize'
);


let sizes = [];


if(Array.isArray(product.sizes)){

sizes =
product.sizes;

}

else{

sizes =
String(
product.sizes ||
'S,M,L,XL,XXL'
)
.split(',');

}


sizes =
sizes
.map(size => String(size).trim())
.filter(Boolean);


if(!sizes.length){

sizes =
['S','M','L','XL','XXL'];

}


sizeSelect.innerHTML =
sizes
.map(size => `

<option value="${escapeHTML(size)}">
${escapeHTML(size)}
</option>

`)
.join('');


}


/* =====================================================
ADD TO CART
===================================================== */

function addToCart(){

if(!product){

return;

}


const size =
document
.getElementById('productSize')
.value;


let cart = [];


try{

cart =
JSON.parse(
localStorage.getItem('lh_cart') || '[]'
);

if(!Array.isArray(cart)){

cart=[];

}

}catch(error){

cart=[];

}


cart.push({

...product,

size:size

});


localStorage.setItem(
'lh_cart',
JSON.stringify(cart)
);


alert(
product.name +
' — Size ' +
size +
' added to cart.'
);

}


/* =====================================================
ORDER NOW
===================================================== */

function orderNow(){

if(!product){

return;

}


const size =
document
.getElementById('productSize')
.value;


document
.getElementById('checkoutProductImage')
.src =
product.image;


document
.getElementById('checkoutProductName')
.textContent =
product.name;


document
.getElementById('checkoutProductSize')
.textContent =
'Size: ' +
size;


document
.getElementById('checkoutProductPrice')
.textContent =
'Rs. ' +
Number(product.price)
.toLocaleString('en-PK');


document
.getElementById('checkoutOverlay')
.classList
.add('show');


document.body.style.overflow =
'hidden';


calculatePayment();

}


/* =====================================================
CLOSE CHECKOUT
===================================================== */

function closeCheckout(){

document
.getElementById('checkoutOverlay')
.classList
.remove('show');


document.body.style.overflow='';

}


/* =====================================================
PAYMENT METHOD
===================================================== */

function getPaymentMethod(){

const selected =
document.querySelector(
'input[name="paymentMethod"]:checked'
);

return selected ?
selected.value :
'cod';

}


/* =====================================================
CALCULATE PAYMENT
===================================================== */

function calculatePayment(){

if(!product){

return;

}


const method =
getPaymentMethod();


const deliveryArea =
document
.getElementById('deliveryArea')
.value;


const subtotal =
Number(product.price);


const delivery =
deliveryArea === 'karachi'
? 300
: 600;


let discount=0;
let total=0;
let advanceAmount=0;
let codAmount=0;


/* 100% COD */

if(method === 'cod'){

discount=0;

total =
subtotal +
delivery;

advanceAmount=0;

codAmount=total;

}


/* 50% ADVANCE */

else if(method === 'half'){

discount=0;

total =
subtotal +
delivery;

advanceAmount =
Math.round(
total * 0.50
);

codAmount =
total -
advanceAmount;

}


/* 100% ADVANCE */

else if(method === 'full'){

discount =
Math.round(
subtotal * 0.02
);

total =
subtotal +
delivery -
discount;

advanceAmount=total;

codAmount=0;

}


/* SUMMARY */

document
.getElementById('summaryProduct')
.textContent =
formatPKR(subtotal);


document
.getElementById('summaryDelivery')
.textContent =
formatPKR(delivery);


document
.getElementById('summaryDiscount')
.textContent =
'-' +
formatPKR(discount);


document
.getElementById('summaryTotal')
.textContent =
formatPKR(total);


document
.getElementById('summaryAdvance')
.textContent =
formatPKR(advanceAmount);


document
.getElementById('summaryCOD')
.textContent =
formatPKR(codAmount);


/* BANK DETAILS */

const bankBox =
document.getElementById(
'bankBox'
);


if(
method === 'half' ||
method === 'full'
){

bankBox
.classList
.add('show');

}else{

bankBox
.classList
.remove('show');

}


/* PAYMENT UI */

document
.getElementById('paymentBoxCod')
.classList
.toggle(
'selected',
method === 'cod'
);


document
.getElementById('paymentBoxHalf')
.classList
.toggle(
'selected',
method === 'half'
);


document
.getElementById('paymentBoxFull')
.classList
.toggle(
'selected',
method === 'full'
);

}


/* =====================================================
DELIVERY CHANGE
===================================================== */

document
.getElementById('deliveryArea')
.addEventListener(
'change',
calculatePayment
);


/* =====================================================
FORMAT PKR
===================================================== */

function formatPKR(number){

return 'Rs. ' +
Number(number || 0)
.toLocaleString('en-PK');

}


/* =====================================================
PHONE VALIDATION
===================================================== */

function validatePhone(phone){

const cleaned =
phone.replace(
/[\s-]/g,
''
);

return /^(\+92|0092|03)\d{9,10}$/
.test(cleaned);

}


/* =====================================================
ORDER ID
===================================================== */

function generateOrderId(){

const now =
new Date();


const date =
now.getFullYear().toString() +

String(
now.getMonth()+1
).padStart(2,'0') +

String(
now.getDate()
).padStart(2,'0');


const random =
Math.floor(
1000 +
Math.random()*9000
);


return 'TLH-' +
date +
'-' +
random;

}


/* =====================================================
SUBMIT ORDER
===================================================== */

async function submitOrder(){

if(!product){

return;

}


const name =
document
.getElementById('custName')
.value
.trim();


const phone =
document
.getElementById('custPhone')
.value
.trim();


const country =
document
.getElementById('custCountry')
.value
.trim();


const city =
document
.getElementById('custCity')
.value
.trim();


const address =
document
.getElementById('custAddress')
.value
.trim();


const deliveryArea =
document
.getElementById('deliveryArea')
.value;


const notes =
document
.getElementById('custNotes')
.value
.trim();


const size =
document
.getElementById('productSize')
.value;


const paymentMethod =
getPaymentMethod();


/* VALIDATION */

if(!name){

alert(
'Please enter your full name.'
);

document
.getElementById('custName')
.focus();

return;

}


if(!phone){

alert(
'Please enter your phone number.'
);

document
.getElementById('custPhone')
.focus();

return;

}


if(!validatePhone(phone)){

alert(
'Please enter a valid Pakistan phone number.'
);

document
.getElementById('custPhone')
.focus();

return;

}


if(!country){

alert(
'Please select your country.'
);

return;

}


if(!city){

alert(
'Please enter your city.'
);

document
.getElementById('custCity')
.focus();

return;

}


if(!address){

alert(
'Please enter your delivery address.'
);

document
.getElementById('custAddress')
.focus();

return;

}


if(!size){

alert(
'Please select a size.'
);

return;

}


/* =====================================================
TOTALS
===================================================== */

const subtotal =
Number(product.price);


const delivery =
deliveryArea === 'karachi'
? 300
: 600;


let discount=0;
let total=0;
let advanceAmount=0;
let codAmount=0;


if(paymentMethod === 'cod'){

discount=0;

total =
subtotal +
delivery;

advanceAmount=0;

codAmount=total;

}


else if(paymentMethod === 'half'){

discount=0;

total =
subtotal +
delivery;

advanceAmount =
Math.round(
total * 0.50
);

codAmount =
total -
advanceAmount;

}


else if(paymentMethod === 'full'){

discount =
Math.round(
subtotal * 0.02
);

total =
subtotal +
delivery -
discount;

advanceAmount=total;

codAmount=0;

}


/* =====================================================
PAYMENT STATUS
===================================================== */

let paymentStatus =
'Pending';


if(paymentMethod === 'cod'){

paymentStatus =
'COD';

}

else if(paymentMethod === 'half'){

paymentStatus =
'50% Advance Pending';

}

else if(paymentMethod === 'full'){

paymentStatus =
'100% Advance Pending';

}


/* =====================================================
ORDER ID
===================================================== */

const orderId =
generateOrderId();


/* =====================================================
ORDER DATA
===================================================== */

const orderData = {

secret:
ORDER_SECRET,

orderId:
orderId,

date:
new Date().toISOString(),

/* CUSTOMER */

customerName:
name,

name:
name,

customerPhone:
phone,

phone:
phone,

customerCountry:
country,

country:
country,

customerCity:
city,

city:
city,

customerAddress:
address,

address:
address,

/* DELIVERY */

deliveryArea:

deliveryArea === 'karachi'
? 'Karachi'
: 'Rest of Pakistan',

/* PRODUCT */

items:[

{

id:
product.id,

name:
product.name,

price:
Number(product.price),

size:
size,

quantity:1

}

],

/* AMOUNTS */

subtotal:
subtotal,

delivery:
delivery,

originalTotal:
subtotal + delivery,

discount:
discount,

total:
total,

advanceAmount:
advanceAmount,

codAmount:
codAmount,

/* PAYMENT */

paymentMethod:

paymentMethod === 'cod'

? '100% COD'

: paymentMethod === 'half'

? '50% Advance + 50% COD'

: '100% Advance',

paymentStatus:
paymentStatus,

notes:
notes

};


/* =====================================================
SUBMIT
===================================================== */

const button =
document.getElementById(
'placeOrderBtn'
);


button.disabled=true;

button.textContent =
'SUBMITTING ORDER...';


document
.getElementById('loading')
.classList
.add('show');


try{

const response =
await fetch(
GOOGLE_SCRIPT_URL,
{

method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:
JSON.stringify(orderData)

});


let result=null;


try{

result =
await response.json();

}catch(error){

result=null;

}


if(!response.ok){

throw new Error(
'Server returned an error.'
);

}


if(
result &&
result.ok === false
){

throw new Error(
result.error ||
'Order could not be saved.'
);

}


/* SUCCESS */

document
.getElementById('loading')
.classList
.remove('show');


button.disabled=false;

button.textContent =
'PLACE ORDER';


document
.getElementById('checkoutContent')
.style.display='none';


document
.getElementById('successContent')
.style.display='block';


document
.getElementById('successOrderId')
.textContent =
'Order ID: ' +
orderId;


/* SAVE LAST ORDER */

localStorage.setItem(
'lh_last_order',
JSON.stringify(orderData)
);


}catch(error){

console.error(
'Order submission error:',
error
);


document
.getElementById('loading')
.classList
.remove('show');


button.disabled=false;

button.textContent =
'PLACE ORDER';


alert(
'Order submit nahi ho saka. Please internet connection check karein aur dobara try karein.'
);

}

}


/* =====================================================
FINISH ORDER
===================================================== */

function finishOrder(){

document
.getElementById('successContent')
.style.display='none';


document
.getElementById('checkoutContent')
.style.display='block';


document
.getElementById('checkoutOverlay')
.classList
.remove('show');


document.body.style.overflow='';


document
.getElementById('custName')
.value='';


document
.getElementById('custPhone')
.value='';


document
.getElementById('custCountry')
.value='Pakistan';


document
.getElementById('custCity')
.value='';


document
.getElementById('custAddress')
.value='';


document
.getElementById('custNotes')
.value='';


document
.getElementById('deliveryArea')
.value='karachi';


document
.querySelector(
'input[name="paymentMethod"][value="cod"]'
)
.checked=true;


calculatePayment();

}


/* =====================================================
OUTSIDE CLICK
===================================================== */

document
.getElementById('checkoutOverlay')
.addEventListener(
'click',
function(event){

if(event.target === this){

closeCheckout();

}

}
);


/* =====================================================
ESC KEY
===================================================== */

document.addEventListener(
'keydown',
function(event){

if(event.key === 'Escape'){

closeCheckout();

}

}
);


/* =====================================================
START
===================================================== */

loadProduct();

</script>
